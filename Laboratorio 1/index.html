<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATI[UCV] 2025-2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Comic Sans MS;
            line-height: 1.6;
        }
        header {
            padding: 10px;
            background-color: #689ed5;
        }


        nav ul {
            list-style: none;
            display: flex;
        }

        .nombre-pagina,
        .usuario,
        .search-container {
            flex-grow: 1; 
            text-align: center; 
            padding: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100%; 
        }



        .search-container {
            justify-content: flex-end; 
        }
        
        .ucv-small {
            font-size: 0.7em;
            vertical-align: sub;
        }

        .search-form {
            display: flex;
            gap: 5px;
        }

        .search-form input {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .search-form button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .search-form button:hover {
            background-color: #0056b3;
        }

        
        section {
            padding: px;
            min-height: 400px;
        }

        .gallery {
            list-style: none;
            padding: 0; 
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            
        }


        .person-card {
            border: 1px solid #ccc;
            background-color: #f4f4f8;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 1px solid #ccc;
            padding: 10px;
            height: 100%;
            box-shadow: 1px 1px 0px rgb(202, 201, 201);
        }

        .person-card .foto {
            width: 100%;
            height: 150px; 
            object-fit: contain; 
            display: block;
            margin: 0 auto; 
            align-self: center;
        }


        .person-card p {
            color: #0056b3;
            font-size: 14px;
            margin: 0;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        footer {
            padding: 20px;
            background-color: #689ed5;
            text-align: center;
            color: #ffffff;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <div class="nombre-pagina" style="justify-content: flex-start; text-align: left; color: white; font-size: 1.5em; font-weight: bold;">
                    <li>ATI<span class="ucv-small">[ucv]</span> 2025-2</li>
                </div>
                
                <div class="usuario" style="color: white; font-size: 1em;">
                    <li>Hola, Thibisay </li>
                </div>
                
                <div class="search-container">
                    <li>
                        <form class="search-form">
                            <input type="text" placeholder="Nombre..." aria-label="Campo de búsqueda" style="color: black; background-color: white;">
                            <button type="submit" style="background-color: #d5e5f8; color: #007bff; border: 1px solid #d5e5f8;">Buscar</button>
                        </form>
                    </li>
                </div>
            </ul>
        </nav>
    </header>

    <section>
        <ul class="gallery">
            <li class="person-card">
                <img src="30455930/30455930.jpg" alt="Thibisay Palma" class="foto">
                <p>Thibisay Palma</p>
            </li>
            <li class="person-card">
                <img src="dummy1/dummy.jpg" alt="Juan Antonio Perez" class="foto">
                <p>Juan Antonio Perez</p>
            </li>
            <li class="person-card">
                <img src="dummy2/dummy.jpg" alt="Maritza Rodriguez" class="foto">
                <p>Maritza Rodriguez</p>
            </li>
            <li class="person-card">
                <img src="dummy3/dummy.jpg" alt="Emilia Casado" class="foto">
                <p>Emilia Casado</p>
            </li>
            <li class="person-card">
                <img src="dummy4/dummy.jpg" alt="Maria Elena Pinto" class="foto">
                <p>Maria Elena Pinto</p>
            </li>
            <li class="person-card">
                <img src="dummy5/dummy.jpg" alt="Ronald Gutierrez" class="foto">
                <p>Ronald Gutierrez</p>
            </li>
            <li class="person-card">
                <img src="dummy6/dummy.jpg" alt="Juan Antonio Perez" class="foto">
                <p>Juan Antonio Perez</p>
            </li>
        </ul>
    </section>


    <footer>
        <p>Copyright &copy; 2025 Escuela de computación - ATI. Todos los derechos reservados </p>
    </footer>
</body>
</html>
